name: Publish NuGet

# ─── Triggers ─────────────────────────────────────────────────────────────────
# 1. Automatic: Triggered by Release Please when a release PR is merged.
#    The workflow_dispatch input 'version' will be set to the new SemVer.
# 2. Manual: Also triggered by pushing a 'v*.*.*' tag manually (legacy support).
# 3. Manual dispatch: Via GitHub UI for debugging.
#
# Automatic versioning flow:
#   Commit with Conventional prefix (e.g. 'feat:') →
#   release-please.yml creates/updates Release PR →
#   Maintainer merges Release PR →
#   release-please creates GitHub Release + tag vX.Y.Z →
#   release-please triggers this workflow via workflow_dispatch →
#   Verify Mutation Gate (run Stryker if needed) → Pack → Sign → Attest → Publish to NuGet.org
# ─────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*.*.*"           # Legacy: manual tag push still works
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3 — without 'v' prefix)"
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ─── Job 1: Verify Stryker Mutation Quality Gate on main ────────────────────
  mutation-gate-check:
    name: Verify Mutation Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
      actions: read
    outputs:
      needs_stryker: ${{ steps.check.outputs.needs_stryker }}
      can_proceed: ${{ steps.check.outputs.can_proceed }}
      evaluated_commit: ${{ steps.check.outputs.evaluated_commit }}
      mutation_score: ${{ steps.check.outputs.mutation_score }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Mutation Quality Gate on main
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const verifyMutationGate = require('./scripts/verify-mutation-gate.js');
            await verifyMutationGate({ github, context, core });

  # ─── Job 2: Conditional Stryker Execution if needed ────────────────────────
  stryker-gate:
    name: Run Stryker Mutation Gate (Conditional)
    needs: mutation-gate-check
    if: needs.mutation-gate-check.outputs.needs_stryker == 'true'
    permissions:
      contents: read
      statuses: write
      actions: read
    uses: ./.github/workflows/mutation-testing.yml
    with:
      mutation-level: "Standard"

  # ─── Job 3: Publish to NuGet (Strict Quality Gate Required) ────────────────
  publish:
    name: Pack & Publish
    needs: [mutation-gate-check, stryker-gate]
    if: |
      always() &&
      (needs.mutation-gate-check.result == 'success') &&
      (
        (needs.mutation-gate-check.outputs.needs_stryker == 'false' && needs.mutation-gate-check.outputs.can_proceed == 'true') ||
        (needs.mutation-gate-check.outputs.needs_stryker == 'true' && needs.stryker-gate.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # Required for Sigstore OIDC attestation
      contents: write        # Required for GitHub Release creation
      attestations: write    # Required for actions/attest-build-provenance
      statuses: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── Resolve version ──────────────────────────────────────────────────────
      # Priority: workflow_dispatch input → git tag → fallback to Directory.Build.props
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from workflow_dispatch input: $INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from git tag: $VERSION"
          else
            VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo "1.0.0")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from Directory.Build.props: $VERSION"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ─── Strong Name key ──────────────────────────────────────────────────────
      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Restore
        run: dotnet restore EricksonLopez.Transaction.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Transaction.slnx --no-restore --configuration Release

      # ─── Full test suite before publish ──────────────────────────────────────
      - name: Run tests before publish
        run: |
          dotnet test EricksonLopez.Transaction.slnx \
            --no-build \
            --configuration Release \
            --logger "trx" \
            --results-directory ./test-results \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Upload coverage to Codecov (publish gate)
        uses: codecov/codecov-action@13ce06bfc6bbe3ecf90edbbf1bc32fe5978ca1d3 # v5.3.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/coverage.opencover.xml"
          fail_ci_if_error: false
          flags: publish-gate
          name: codecov-publish

      # ─── Pack all packages ────────────────────────────────────────────────────
      - name: Pack All Packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACK_ARGS="--no-build --configuration Release --output ./nupkgs -p:VersionPrefix=$VERSION -p:TreatWarningsAsErrors=true"
          dotnet pack src/EricksonLopez.Transaction.Abstractions/EricksonLopez.Transaction.Abstractions.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction/EricksonLopez.Transaction.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction.Dapper/EricksonLopez.Transaction.Dapper.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction.MariaDb/EricksonLopez.Transaction.MariaDb.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction.MySql/EricksonLopez.Transaction.MySql.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction.Oracle/EricksonLopez.Transaction.Oracle.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction.PostgreSql/EricksonLopez.Transaction.PostgreSql.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction.Result/EricksonLopez.Transaction.Result.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction.Sqlite/EricksonLopez.Transaction.Sqlite.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction.SqlServer/EricksonLopez.Transaction.SqlServer.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Transaction.Testing/EricksonLopez.Transaction.Testing.csproj $PACK_ARGS
          echo "Packed packages:"
          ls -la ./nupkgs/

      # ─── Sigstore Provenance Attestation ─────────────────────────────────────
      - name: Generate Sigstore Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-path: './nupkgs/*.nupkg'

      # ─── NuGet.org publish via OIDC ──────────────────────────────────────────
      - name: NuGet login (OIDC)
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: login
        with:
          user: ericksonlopezf

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # ─── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: false
          body: |
            ## Ecosystem Packages in this release

            | Package | Version |
            |---------|---------|
            | `EricksonLopez.Transaction.Abstractions` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction.Dapper` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction.MariaDb` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction.MySql` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction.Oracle` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction.PostgreSql` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction.Result` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction.Sqlite` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction.SqlServer` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Transaction.Testing` | `${{ steps.version.outputs.VERSION }}` |

            ---

            For detailed changes, see [CHANGELOG.md](https://github.com/ericksonlopezf/dotnet-transaction/blob/${{ github.ref_name }}/CHANGELOG.md).
          files: ./nupkgs/*.nupkg
          draft: false
